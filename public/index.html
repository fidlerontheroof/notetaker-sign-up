<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notetaker Sign-Up</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <h1>Notetaker Sign-Up</h1>
  <p class="subtitle">Sign up for one class date. You'll only ever see your own sign-up — everyone else's is private.</p>

  <div id="lookup-card" class="card">
    <label for="email">Your email</label>
    <input type="email" id="email" placeholder="you@school.edu" />
    <button id="check-btn">Check my status</button>
    <div id="lookup-error" class="error"></div>
  </div>

  <div id="status-area"></div>

  <div id="signup-card" class="card" style="display:none;">
    <h2 style="margin-top:0; font-size:1.1rem;">Available dates</h2>
    <div id="dates-list"></div>
  </div>

  <div id="signup-form-card" class="card" style="display:none;">
    <h2 style="margin-top:0; font-size:1.1rem;" id="form-title">Sign up</h2>
    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="Full name" />
    <input type="hidden" id="chosen-date" />
    <button id="submit-btn"></button>
    <div id="form-error" class="error"></div>
    <div id="form-success" class="success"></div>
  </div>

  <a class="admin-link" href="/admin.html">Instructor admin login →</a>
</div>

<script src="app.js"></script>
</body>
</html>
